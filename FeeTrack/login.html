<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | FeeTrack</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<main class="login-page">

  <div class="login-brand">
    <div class="brand-icon">₹</div>
    <h1>FeeTrack</h1>
    <p>Secure Fee Management</p>
  </div>

  <div class="login-card">

    <div class="heading">
      <h2>Welcome back</h2>
      <p>Sign in to continue</p>
    </div>

    <div class="tabs">
      <button id="adminTab" class="active">Administrator</button>
      <button id="studentTab">Student</button>
    </div>

    <form id="loginForm">

      <label>Username / Student ID</label>
      <input id="username" placeholder="Enter admin username" required>

      <div class="password-label">
        <label>Password</label>
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>

      <div class="password-box">
        <input id="password" type="password" placeholder="Enter password" required>
        <button type="button" id="togglePassword">Show</button>
      </div>

      <label class="remember">
        <input type="checkbox" id="remember">
        Remember me
      </label>

      <button class="login-submit" type="submit">Sign In</button>

      <div id="loginMessage"></div>
    </form>

    <div class="demo" id="demoInfo">
      <strong>Demo Admin</strong>
      <code>admin</code>
      <code>admin123</code>
    </div>

  </div>

  <a class="back" href="index.html">← Back to home</a>

</main>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
